name: Reminder Batch

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日 23:00 UTC = 翌日 8:00 JST
  workflow_dispatch:       # 手動実行も可能にする

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Run reminder batch
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.BATCH_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.RAILWAY_API_URL }}/api/batch/reminder")
          echo "HTTP Status: $response"
          echo "Response: $(cat /tmp/response.json)"
          if [ "$response" != "200" ]; then
            echo "Batch failed with status $response"
            exit 1
          fi
