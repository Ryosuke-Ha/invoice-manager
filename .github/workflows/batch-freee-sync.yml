name: Freee Sync Batch

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 00:00 UTC = 9:00 JST
  workflow_dispatch:       # 手動実行も可能にする

jobs:
  freee-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run freee sync batch
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.BATCH_SECRET_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.RAILWAY_API_URL }}/api/batch/freee-sync")
          echo "HTTP Status: $response"
          echo "Response: $(cat /tmp/response.json)"
          if [ "$response" != "200" ]; then
            echo "Batch failed with status $response"
            exit 1
          fi
